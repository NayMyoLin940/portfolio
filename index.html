<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nay Myo Lin is a full stack developer creating accessible interfaces, reliable APIs, and thoughtful digital products."
    />
    <meta name="author" content="Nay Myo Lin" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nay Myo Lin Portfolio" />
    <meta property="og:title" content="Nay Myo Lin | Full Stack Developer" />
    <meta
      property="og:description"
      content="Full stack developer creating accessible interfaces, reliable APIs, and thoughtful digital products."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nay Myo Lin | Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Full stack developer creating accessible interfaces, reliable APIs, and thoughtful digital products."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Nay Myo Lin | Full Stack Developer</title>

    <script>
      ;(() => {
        let theme = 'light'

        try {
          const savedTheme = localStorage.getItem('portfolio-theme')
          theme =
            savedTheme === 'light' || savedTheme === 'dark'
              ? savedTheme
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch {
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }

        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0b1120' : '#ffffff')
      })()
    </script>

    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ffffff;
        opacity: 1;
        visibility: visible;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      [data-theme='dark'] #app-loader {
        background: #0b1120;
      }

      .app-loader__mark {
        width: 2.25rem;
        height: 2.25rem;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 9999px;
        animation: loader-spin 700ms linear infinite;
      }

      .app-loader__label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #app-loader.app-loader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loader__mark {
          animation: none;
        }

        #app-loader {
          transition-duration: 0.01ms;
        }
      }
    </style>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nay Myo Lin",
        "jobTitle": "Full Stack Developer"
      }
    </script>
  </head>
  <body>
    <div id="app-loader" role="status" aria-live="polite">
      <span class="app-loader__mark" aria-hidden="true"></span>
      <span class="app-loader__label">Loading portfolio</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
